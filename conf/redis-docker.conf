# Redis configuration file for Docker

# By default Redis does not run as a daemon. Use 'no' for Docker containers.
daemonize no

# Accept connections on the specified port, default is 6379.
port 6379

# Set server verbosity
loglevel notice

# Specify the log file name. Using stdout for Docker
logfile ""

# Set the number of databases.
databases 16

################################ SNAPSHOTTING  #################################
save 900 1
save 300 10
save 60 10000

# Stop accepting writes if saving fails
stop-writes-on-bgsave-error yes

# Compress string objects using LZF when dump .rdb databases?
rdbcompression yes

# CRC64 checksum at the end of the file
rdbchecksum yes

# The filename where to dump the DB
dbfilename dump.rdb

# The working directory - using /data which is a standard location in Redis Docker image
dir /data

# Redis Lua scripts configuration
lua-time-limit 5000

